    <script type="text/javascript">
    $(document).ready(function () {
    fetch('/Client_Tour_Json.bc', {
    method: 'POST',
    body: 'tourname=[##cms.form.tourname##]&fdate=[##cms.form.fdate##]&tdate=[##cms.form.tdate##]&userid=[##db.userid.userid##]&rooms=[##cms.json.header|cms.form.roomSearch##]'
})
    .then(response => response.text())
    .then(text => {
        let Maindata = JSON.parse(text.replace(/\'/g, '"'))
        let LenMaindata = Maindata.length
        if (LenMaindata !== undefined) {
            Maindata.sort((a, b) => a.totalCom - b.totalCom);
        }
        $('.wating-search').hide()
        $('#app').show()
        load_data(Maindata)
        
    }).catch(error => console.error(error))

    })


        </script>
           <script type="text/babel">
            function load_data(load_data) {
            class App extends React.Component {
                constructor(props) {
                    super(props);
                    this.state = {
                        data: [],
                        data_currency: [],
                        library: null,
                        perPage: 20,
                        currentPage: 1,
                        currentPage2: 2,
                        currentPage3: 3,
                        maxPage: null,
                        filterName: "",
                        visibleTourInfo: {},
                        visibleDetails: {},
                        visibleBar: {},
                        visibleRule: {},
                        visibleRoomInfo: {},
                        costtable: {},
                        roomids: {},
                        chkbox: true,
                        jsonbackup: {},
                        cityindex: "",
                        roomindex: "",
                        roomcheck: "",
                        chflag: 0,
                        copy: {},
                        costtableinfo: [],
                        Visible_rooms: {},
                        state_airlines: "",
                        state_stops: "",
                        state_classNames: "",
                        state_service: "",
                        state_stars: "",
                        state_availability: "",
                        state_currency_unit: "",
                        state_currency_cost: 1,
                        state_floatdigit: ""
        
                    }
                    this.airlines = [];
                    this.stops = [];
                    this.stars = [];
                    this.service = [];
                    this.availability = [];
                    this.classNames = []
                    this.handleClick = this.handleClick.bind(this);
        
                }
                componentDidMount() {
                    this.setState(state => ({
                        ...state,
                        data: load_data
                    }), () => {
                        this.reorganiseLibrary()
                    })
                    $(document).on('update_result', (event, service, stars, availability, airlines, classNames, stops) => {
                        this.reorganiseLibrary(service, stars, availability, airlines, classNames, stops)
                    })
                    let getCurrencyObject = localStorage.getItem('currencyObject');
            let jsonCurrency = JSON.parse(getCurrencyObject);
            if (jsonCurrency) {
                this.setState({
                    state_currency_unit: jsonCurrency.currency_unit,
                    state_currency_cost: jsonCurrency.currency_cost,
                    state_floatdigit: jsonCurrency.floatdigit,
                })
            }
                }
                componentDidUpdate() {
                    $(".search-item").each(function () {
                        let basiscoreid = $(this).find(".basiscoreid").val()
                        var check_loaded = $(this).attr("date-load-info");
                        var self = $(this)
                        if ($(this).find(".basiscoreid").val()) {
                            if ($(this).find(".basiscoreid").val() == $(this).closest(".search-item").siblings().find(".basiscoreid").val()) {
                                if (check_loaded == 0) {
                                    $.get("/Tem1_Tour_Info.bc?id=" + basiscoreid + "", function (data, status) {
                                        self.find(".load_info_tour").empty().append(data)
                                        self.closest(".search-item").siblings().find(".load_info_tour").empty().append(data)
        
                                    });
                                    $(this).attr("date-load-info", "1")
                                    $(this).siblings().attr("date-load-info", "1")
                                }
                            } else {
                                $.get("/Tem1_Tour_Info.bc?id=" + basiscoreid + "", function (data, status) {
                                    self.find(".load_info_tour").empty().append(data)
                                });
        
                            }
                        }
                    })
                    $(".airline_filter").sort(function (a, b) {
                        a = $(".min_total", a).text().replace(/,/g, '');
                        b = $(".min_total", b).text().replace(/,/g, '');
                        return a - b;
                    }).appendTo(".airline_results");
                    $(".unit_content").each(function () {
                        if ($(this).text() == 'ريالریال') {
                            $(this).text('ریال')
                        }
                    })
                    $(".grade_filter").sort(function (a, b) {
                        a = $(".stars", a).val().replace(/,/g, '');
                        b = $(".stars", b).val().replace(/,/g, '');
                        return b - a;
                    }).appendTo(".grade_results");
                    $(document).on('click', function (event) {
                        if (!$(event.target).closest('.section-filter-icon,.section-filter-content').length) {
                            $(".section-filter").removeClass('section-filter-open')
                            $(".section-filter-content").animate({ right: '-100%' }, 350);
                        }
        
                    })
                }
                reorganiseLibrary = (service, stars, availability, airlines, classNames, stops) => {
                    const { filterName, perPage, data } = this.state
                    let library = data
                    if (filterName !== "") {
                        library = library.filter(item =>
                            this.render_filter_search(item).toString().toLowerCase().includes(filterName)
                        )
                        let lenLibrary = library.length
                        $('.list_count').text(lenLibrary)
                    }
                    if (stars !== undefined) {
                        if (stars !== "") {
                            stars = stars.split(",");
                            library = library.filter(item => {
                                if (this.renderFilter_search(item.hotelinfo, 'star').some(r => stars.includes(r))) return item;
        
                            })
                        }
                        let lenLibrary = library.length
                        $('.list_count').text(lenLibrary)
                    }
                    if (service !== undefined) {
                        if (service !== "") {
                            service = service.split(",");
                            library = library.filter(item => {
                                if (this.renderFilter_search(item.hotelinfo, 'sevice').some(r => service.includes(r))) return item;
        
                            })
                        }
                        let lenLibrary = library.length
                        $('.list_count').text(lenLibrary)
                    }
        
                    if (availability !== undefined) {
                        if (availability !== "") {
                            availability = availability.split(",");
                            library = library.filter(item => {
                                if (this.renderFilter_search(item.hotelinfo, 'availability').some(r => availability.includes(r))) return item;
        
                            })
                        }
        
                        let lenLibrary = library.length
                        $('.list_count').text(lenLibrary)
        
                    }
                    if (airlines !== undefined) {
                        if (airlines !== "") {
                            airlines = airlines.split(",");
                            library = library.filter(item => {
                                if (this.renderFilter_search(item, 'airlines').some(r => airlines.includes(r))) return item;
        
        
                            })
                        }
                        let lenLibrary = library.length
                        $('.list_count').text(lenLibrary)
                    }
        
                    if (stops !== undefined) {
                        if (stops !== "") {
                            stops = stops.split(",");
                            library = library.filter(item => {
                                if (this.renderFilter_search(item, 'stops').some(r => stops.includes(r))) return item;
        
                            })
                        }
                        let lenLibrary = library.length
                        $('.list_count').text(lenLibrary)
                    }
                    if (classNames !== undefined) {
                        if (classNames !== "") {
                            classNames = classNames.split(",");
                            library = library.filter(item => {
                                if (this.renderFilter_search(item, 'classNames').some(r => classNames.includes(r))) return item;
                            })
                        }
                        let lenLibrary = library.length
                        $('.list_count').text(lenLibrary)
                    }
                    let lenLibrary = library.length
                    if (lenLibrary == undefined) {
                        $('.list_count').text(0)
                    } else {
                        $('.list_count').text(lenLibrary)
                    }
                    library = _.chunk(library, perPage)
                    this.setState({
                        library,
                        currentPage: 1,
                        maxPage: library.length === 0 ? 1 : library.length
                    })
                }
                render_filter_search = (element) => {
                    let lenhotelinfo = element.hotelinfo.length
                    for (let i = 0; i < lenhotelinfo; i++) {
                        for (let i = 0; i < lenhotelinfo; i++) {
                            let lenhotel = element.hotelinfo[i].hotel.length
                            let indents = []
                            for (let j = 0; j < lenhotel; j++) {
                                indents.push(element.hotelinfo[i].hotel[j].hotelinfo.name)
                            }
                            return (
                                indents
                            )
                        }
                    }
                }
        
                renderFilter_search(element, type) {
                    if (type == 'star') {
                        let elementAdd = []
                        for (let i = 0; i < element.length; i++) {
                            for (let j = 0; j < element[i].hotel.length; j++) {
                                elementAdd.push(element[i].hotel[j].hotelinfo.hotelsearch.star.toString())
                            }
        
                        }
                        return elementAdd
                    } if (type == 'sevice') {
                        let elementAdd = []
                        for (let i = 0; i < element.length; i++) {
                            for (let j = 0; j < element[i].hotel.length; j++) {
                                elementAdd.push(element[i].hotel[j].hotelinfo.hotelsearch.services)
                            }
        
                        }
                        return elementAdd
                    } if (type == 'availability') {
                        let elementAdd = []
                        for (let i = 0; i < element.length; i++) {
                            for (let j = 0; j < element[i].hotel.length; j++) {
                                for (let y = 0; y < element[i].hotel[j].families.length; y++) {
                                    for (let z = 0; z < element[i].hotel[j].families[y].availablerooms.length; z++) {
                                        elementAdd.push(element[i].hotel[j].families[y].availablerooms[z].info.availability)
                                    }
                                }
        
                            }
        
                        }
                        return elementAdd
                    }
                    if (type == 'classNames') {
                        let elementAdd = []
                        for (let i = 0; i < element.backtobackinfo.mainflights.length; i++) {
                            elementAdd.push(element.backtobackinfo.mainflights[i].classname)
                        }
                        for (let i = 0; i < element.onewayflights.length; i++) {
                            elementAdd.push(element.onewayflights[i].classname)
                        }
                        return elementAdd
                    }
                    if (type == 'stops') {
                        let elementAdd = []
                        for (let i = 0; i < element.backtobackinfo.mainflights.length; i++) {
                            elementAdd.push(element.backtobackinfo.mainflights[i].ticketinfooo.stoppinfoo.showstopinfo)
                        }
                        for (let i = 0; i < element.onewayflights.length; i++) {
                            elementAdd.push(element.onewayflights[i].ticketinfooo.stoppinfoo.showstopinfo)
                        }
                        return elementAdd
                    }
        
                    if (type == 'airlines') {
                        let elementAdd = []
                        for (let i = 0; i < element.backtobackinfo.mainflights.length; i++) {
        
                            for (let j = 0; j < element.backtobackinfo.mainflights[i].routeshow.routesinfoo.length; j++) {
                                elementAdd.push(element.backtobackinfo.mainflights[i].routeshow.routesinfoo[j].routesinfoodetails.otherdetails.detailsairline)
                            }
        
                        }
                        for (let i = 0; i < element.onewayflights.length; i++) {
                            for (let j = 0; j < element.onewayflights[i].routeshow.routesinfoo.length; j++) {
                                elementAdd.push(element.onewayflights[i].routeshow.routesinfoo[j].routesinfoodetails.otherdetails.detailsairline)
                            }
        
                        }
                        return elementAdd
        
                    }
                }
        
                // Previous Page
                previousPage = event => {
                    let maxPage = this.state.maxPage
                    let len = this.renderLibrary().length
                    let Multi = len * maxPage
                    for (let i = 0; i <= Multi; i++) {
                        this.setState(prevState => ({
                            visibleDetails: { ...prevState.visibleDetails, [i]: "" },
                            visibleRule: { ...prevState.visibleRule, [i]: "" },
                            visibleBar: { ...prevState.visibleBar, [i]: "" },
                            visibleTourInfo: { ...prevState.visibleTourInfo, [i]: "" },
                            visibleRoomInfo: { ...prevState.visibleRoomInfo, [i]: "" },
                            Visible_rooms: { ...prevState.Visible_rooms, [i]: "" },
                        }))
                    }
                    this.handleClick(event)
                    this.setState({
                        currentPage: this.state.currentPage - 1,
                        currentPage2: this.state.currentPage2 - 1,
                        currentPage3: this.state.currentPage3 - 1
                    })
                }
                // Next Page 
                nextPage = event => {
                    let maxPage = this.state.maxPage
                    let len = this.renderLibrary().length
                    let Multi = len * maxPage
                    for (let i = 0; i <= Multi; i++) {
                        this.setState(prevState => ({
                            visibleDetails: { ...prevState.visibleDetails, [i]: "" },
                            visibleRule: { ...prevState.visibleRule, [i]: "" },
                            visibleBar: { ...prevState.visibleBar, [i]: "" },
                            visibleTourInfo: { ...prevState.visibleTourInfo, [i]: "" },
                            visibleRoomInfo: { ...prevState.visibleRoomInfo, [i]: "" },
                            Visible_rooms: { ...prevState.Visible_rooms, [i]: "" },
                        }))
                    }
                    this.handleClick(event)
                    this.setState({
                        currentPage: this.state.currentPage + 1,
                        currentPage2: this.state.currentPage2 + 1,
                        currentPage3: this.state.currentPage3 + 1
                    })
                }
        
                // Next Page3
                nextPage3 = event => {
                    let maxPage = this.state.maxPage
                    let len = this.renderLibrary().length
                    let Multi = len * maxPage
                    for (let i = 0; i <= Multi; i++) {
                        this.setState(prevState => ({
                            visibleDetails: { ...prevState.visibleDetails, [i]: "" },
                            visibleRule: { ...prevState.visibleRule, [i]: "" },
                            visibleBar: { ...prevState.visibleBar, [i]: "" },
                            visibleTourInfo: { ...prevState.visibleTourInfo, [i]: "" },
                            visibleRoomInfo: { ...prevState.visibleRoomInfo, [i]: "" },
                            Visible_rooms: { ...prevState.Visible_rooms, [i]: "" },
                        }))
                    }
                    this.handleClick(event)
                    this.setState({
                        currentPage: this.state.currentPage3,
                        currentPage2: this.state.currentPage3 + 1,
                        currentPage3: this.state.currentPage3 + 2
                    })
                }
        
                // handle filter
                handlerFilterName = evt => {
                    const { state_service, state_stars, state_availability, state_airlines, state_classNames, state_stops } = this.state;
                    this.setState(
                        {
                            filterName: evt.target.value.toLowerCase()
                        },
                        () => {
                            this.reorganiseLibrary(state_service, state_stars, state_availability, state_airlines, state_classNames, state_stops);
                        }
                    )
                }
        
        
                // handle per page
                handlePerPage = (evt) =>
                    this.setState({
                        perPage: evt.target.value
                    }, () => this.reorganiseLibrary())
        
                // handle render of library
                renderLibrary = () => {
                    const { library, currentPage } = this.state
        
                    if (!library || (library && library.length === 0)) {
                        return <div><div className="message_box message_box_nodata font_13 no-data">
                            <i className="fas fa-exclamation-triangle icon_message_box font-color_2"></i>
                            <div className="line-one font_18">
                                <span>برای جستجوی شما نتیجه ای یافت نشد .</span>
                            </div>
                            <div className="line-two">
                                <div> لطفا برای دریافت بهترین قیمت ها و بررسی مجدد ظرفیت روی دکمه زیر کلیک کنید.</div>
                                <button className="background-color_2 font-weight hvr-horizontal" onClick={this.renderhomepage}>صفحه اصلی</button>
                                <button className="background-color_2 font-weight hvr-horizontal" onClick={this.renderResearch}  >جستجوی مجدد</button>
                            </div>
                        </div></div>
                    }
                    return library[currentPage - 1].map((item) => (
                        <div className="search-item transition tour" date-load-info="0">
                            <form method="post" action={this.renderAction(item)}>
                                <input type="hidden" value={this.state.state_currency_unit} name="rate-unit" className="rate-unit" />
                                <input type="hidden" value={this.state.state_currency_cost} name="rate-cost" className="rate-cost" />
                                <input type="hidden" value={this.state.state_floatdigit} name="rate-floatdigit" className="rate-floatdigit" />
                                <input type="hidden" value="[##db.userid.userid##]" name="userid" />
                                <input type="hidden" value="[##cms.form.tourname##]" name="tourname" />
                                <input type="hidden" value="[##cms.form.tour-search-text##]" name="tour-search-text" />
                                <input type="hidden" value='[##cms.json.header|cms.form.roomSearch##]' name="roomSearch" />
                                <input type="hidden" value={item.id} name="id" />
                                <input type="hidden" value={item.supplier} name="supplier" />
                                <input type="hidden" value={item.share} name="share" />
                                <input type="hidden" value={item.dateinfo.begindate.sstring} name="fdate" />
                                <input type="hidden" value={item.dateinfo.enddate.sstring} name="tdate" />
                                {this.renderproviderId(item.id)}
                                {this.renderprovider(item)}
                                {this.renderNeardate(item)}
                                {this.renderhotelgroupid(item)}
                                <div className="item-result">
                                    <div className="item-result-top  p-relative">
                                        <div className="title-info background-color_1 font-color_4">
                                            <span className="font_12">{item.name}</span>
                                            <span className="font_12">{item.dateinfo.begindate.sstring}</span>
                                            <span className="font_12 EnNum">({item.dateinfo.begindate.mstring})</span>
                                            <span className="font_12">الی</span>
                                            <span className="font_12">{item.dateinfo.enddate.sstring}</span>
                                            <span className="font_12 EnNum">({item.dateinfo.enddate.mstring})</span>
                                            {this.renderTime(item)}
                                        </div>
                                        {this.renderhotelinfo_wrapper(item)}
        
                                        <div className="clr"></div>
                                    </div>
                                    <div className="item-result-bottom">
                                        <div className="item-result-bottom-right float_right font_13">

            if (!json[tour]) {
                total2 = 0
            }
            else {
                let room = 0
                for (room in json[tour]) {
                    total2 += json[tour][room]["total_diff"]
                }
            }
            return new Intl.NumberFormat().format(this.renderTotal(total2 + total, this.state.state_currency_cost, this.state.state_floatdigit))

        }
        renderTotal(element, currency_cost, floatdigit) {
            if (floatdigit == '') {
                return element * currency_cost;
            } else {
                let toString_element = (element * currency_cost).toString();
                if (toString_element.indexOf('.') > -1) {
                    let parseFloat_element = parseFloat(toString_element).toFixed(floatdigit).toString();
                    let parseFloat_element_split = parseFloat_element.split('.');
                    if (parseFloat_element_split[1].indexOf('0') > -1) {
                        return parseFloat(element * currency_cost).toFixed(1).toString();
                    } else {
                        return parseFloat(element * currency_cost).toFixed(floatdigit).toString();
                    }
                } else {
                    return parseFloat(element * currency_cost).toFixed(floatdigit).toString();
                }
            }
        }
        renderUnit(element, currency_unit) {
            if (currency_unit == '') {
                return element;
            } else {
                return currency_unit;
            }

        }
        renderCommission(element) {
            let i = element.commissioncost
            if (i == 0) {
                return '';
            } else {
                let total = element.totalcostmin
                let commissionlen = parseInt(element.commissionDetails.length - 1)
                let com = element.commissionDetails[commissionlen].commission
                let total2 = 0
                let json = this.state.jsonbackup
                let tour = element.id

                if (!json[tour]) {
                    total2 = 0
                } else {
                    let room = 0
                    for (room in json[tour]) {
                        total2 += json[tour][room]["total_diff"]
                    }
                }

                let finalcommission = parseInt(total2 + total) * com
                return <div className="col-price-50 float_right"><div>کمیسیون :</div><div><span className="total-cost font_15"> {new Intl.NumberFormat().format(this.renderTotal(finalcommission, this.state.state_currency_cost, this.state.state_floatdigit))}</span><span className="money-type font_10">{this.renderUnit(element.unit, this.state.state_currency_unit)}</span></div></div>

            }
        }
        renderTotalcom(element) {
            let i = element.totalCom
            let j = element.totalcostmin
            if (i == j) {
                return '';
            } else {
                let total = element.totalcostmin
                let commissionlen = parseInt(element.commissionDetails.length - 1)
                let com = element.commissionDetails[commissionlen].commission
                let total2 = 0
                let json = this.state.jsonbackup
                let tour = element.id
                if (!json[tour]) {
                    total2 = 0
                } else {
                    let room = 0
                    for (room in json[tour]) {
                        total2 += json[tour][room]["total_diff"]
                    }
                }
                let commissioncost = parseInt(total2 + total) * com
                let finaltotalcom = parseInt((total2 + total) - commissioncost)
                return <div className="col-price-50 float_right"><div>مبلغ نهایی:</div><div><span className="total-cost font_15">{new Intl.NumberFormat().format(this.renderTotal(finaltotalcom, this.state.state_currency_cost, this.state.state_floatdigit))}</span><span className="money-type font_10">{this.renderUnit(element.unit, this.state.state_currency_unit)}</span></div></div>

            }
        }

            if (element !== undefined) {

        select_currency_list = (e, element, floatdigit) => {
            this.setState({
                state_currency_unit: element.rate_unit,
                state_currency_cost: element.rate_cost,
                state_floatdigit: floatdigit,
            })
            document.querySelector(".currency-list").classList.toggle("unvisible");
            document.querySelector(".currency-selected").innerText = element.rate_unit;
            this.localStorage_setCurrency(element.rate_unit, element.rate_cost, floatdigit);

        }

        localStorage_setCurrency = (currency_unit, currency_cost, floatdigit) => {
            let currencyObject = {
        'currency_unit': currency_unit,
        'currency_cost': currency_cost,
        'floatdigit': floatdigit,
        'time':new Date().getTime(),
        'expire':1200000,
      };
            localStorage.setItem('currencyObject', JSON.stringify(currencyObject));
        }

        function onloadFunc() {
            var counter = 600;
            setInterval(function () {
                counter--;
                var m = parseInt(counter / 60);
                var s = counter % 60;
                if (counter >= 0) {
                    var timer = document.getElementById("timer");
                    if(timer !== null){

                    
                    if (s < 10) {
                        s = "0" + s;
                    }
                    if (m < 10) {
                        m = "0" + m;
                    }
                    if (m < 2) {
                        document.getElementById("timer").classList.add("blink_me")
                    }
                    timer.innerHTML = "00:" + m + ":" + s;
                }
                }
                if (counter === 0) {
                    $(".message_box_timeout,#bg-popup").fadeIn();
                    $(".message_box_timeout").css("top", "200px")
                    clearInterval(counter)
                }
             }, 1000)
        }
