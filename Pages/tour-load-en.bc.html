<basis core="dbsource" source="basiscore" lid="2" mid="20" name="db" catid="[##cms.query.catid##]">
    <member name="tour-list" type="list" link="tour.bc" propertyid="8181,8076,8077,10000504" typeid="159" />
</basis>
<basis core="list" datamembername="db.tour-list">
    <layout>
        <div class="tour-list-container owl-carousel">
            @child
        </div>
    </layout>
    <face filter="link is null">
        <div class="tour-list-content width_90">
            <article class="inner border-radius card background-color_white">
                <a href="/tour.bc?id=@id">
                    <figure class="p-relative border-radius"><img src="/@type_159"
                        width="380" height="245" alt="@title" class="width_100 border-radius transition" />
                    <div class="effect"></div>
                </figure>
                <div class="desc">
                    <header class="text-left">
                        <h2 class="color_gray title font_18 min-title">@title</h2>
                        <div class="d-flex">
                            <div class="info">
                                <p><i class="icon font_12 text-center far fa-clock"></i><span
                                        class="font_13 slice">@prp_8076</span></p>
                                <p><i class="icon font_12 text-center far fa-calendar-check"></i><span
                                        class="font_13">@prp_8077</span></p>
                            </div>
                            <div class="price">
                                <p class="color_black">Price</p>
                                <p class="color_3 price-text slice">@prp_8181</p>
                            </div>
                        </div>
                    </header>
                    <footer class="text-left"><button
                            class="color_white font_15 background-color_2 btn">View
                            Detail</button></footer>
                </div>
                </a>
        
            </article>
        </div>
    </face>
    <face>
        <div class="tour-list-content width_90">
            <article class="inner border-radius card background-color_white">
                <a href="/@link">
                    <figure class="p-relative border-radius"><img src="/@type_159"
                        width="380" height="245" alt="@title" class="width_100 border-radius transition" />
                    <div class="effect"></div>
                </figure>
                <div class="desc">
                    <header class="text-left">
                        <h2 class="color_gray title font_18 min-title">@title</h2>
                        <div class="d-flex">
                            <div class="info">
                                <p><i class="icon font_12 text-center far fa-clock"></i><span
                                        class="slice font_13">@prp_8076</span></p>
                                <p><i class="icon font_12 text-center far fa-calendar-check"></i><span
                                        class="font_13">@prp_8077</span></p>
                            </div>
                            <div class="price">
                                <p class="color_black">Price</p>
                                <p class="color_3 price-text slice">@prp_8181</p>
                            </div>
                        </div>
                    </header>
                    <footer class="text-left"><button
                            class="color_white font_15 background-color_2 btn">View
                            Detail</button></footer>
                </div>
                </a>
        
            </article>
        </div>
    </face>
</basis>
<script type="text/javascript" >
    $(".tour-list-container").owlCarousel({autoPlay: 4000,items: 3, loop: true, itemsDesktop: [1199, 3],itemsDesktopSmall: [979, 2],itemsTablet: [768, 2],itemsTablet: [602, 1],itemsMobile: [479, 1],navigation: true,navigationText: ['<span class="fa fa-angle-left"></span>', '<span class="fa fa-angle-right"></span>']});
    $(".min-title").each(function () {
        if ($(this).text().length > 35) {
            $(this).text($(this).text().substr(0, 35) + '...')
        }
    })
    $(".slice").each(function () {
    if ($(this).text().charAt(0) == ",") {
      $(this).text($(this).text().substring(1));
    }
   });
</script>
